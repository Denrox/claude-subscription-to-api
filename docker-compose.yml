services:
  claude-subscription-to-api:
    build:
      context: .
    image: claude-subscription-to-api:0.1.0
    container_name: claude-subscription-to-api
    restart: unless-stopped

    user: "${HOST_UID:?set HOST_UID in .env}:${HOST_GID:?set HOST_GID in .env}"

    env_file:
      - .env

    environment:
      PORT: "3000"
      HOME: /home/app
      CLAUDE_HOME: /home/app

    ports:
      - "${HOST_PORT:-80}:3000"

    volumes:
      - ${HOST_HOME:?set HOST_HOME in .env}/.claude:/home/app/.claude
      - ${HOST_HOME}/.claude.json:/home/app/.claude.json
      - ${HOST_CLAUDE_BIN:-${HOST_HOME}/.local/bin/claude}:/usr/local/bin/claude:ro

    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
